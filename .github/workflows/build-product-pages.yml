name: Build Product Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - '.github/workflows/build-product-pages.yml'
      - 'scripts/build-product-pages.mjs'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync SEO product pages
        run: node scripts/build-product-pages.mjs
      - name: Commit generated pages
        run: |
          if git diff --quiet; then
            echo "No product page changes"
            exit 0
          fi
          git config user.name "toburt-product-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sales
          git commit -m "chore: sync product SEO pages [skip ci]"
          git push
