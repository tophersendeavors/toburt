<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toburt Agent Control Center</title><style>:root{color-scheme:dark;--bg:#071018;--p:#0c1722;--l:#213244;--t:#eef5fb;--m:#8fa3b7;--g:#34d399;--y:#fbbf24;--r:#fb7185;--b:#60a5fa;--u:#c084fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.w{max-width:1500px;margin:auto;padding:22px}.top,.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.top h1{margin:0;font-size:22px}.muted,.sub{color:var(--m)}.sub{font-size:11px}.live{color:var(--g);font-weight:800}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}.card,.panel{background:var(--p);border:1px solid var(--l);border-radius:14px}.card{padding:14px}.card b{font-size:24px;display:block}.card span{font-size:12px;color:var(--m)}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.panel{padding:14px;min-width:0}.panel h2{font-size:15px;margin:0 0 12px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px;border-bottom:1px solid #1b2b3b;text-align:left;vertical-align:middle}th{font-size:11px;text-transform:uppercase;color:var(--m)}.name{font-weight:800}.badge{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid #33485c;font-size:11px;font-weight:800}.green{color:var(--g);border-color:#34d39955}.yellow{color:var(--y);border-color:#fbbf2455}.red{color:var(--r);border-color:#fb718555}.blue{color:var(--b);border-color:#60a5fa55}.purple{color:var(--u);border-color:#c084fc55}.run{padding:10px 0;border-bottom:1px solid #1b2b3b}.run:last-child{border:0}.err{color:#fecdd3;background:#4c101c66;padding:8px;border-radius:8px;margin-top:5px;word-break:break-word}.attn{outline:1px solid #fb718566}.alert{background:#3d2408;border:1px solid #7c4a0b;color:#fde68a;padding:10px;border-radius:10px;margin-bottom:10px}.actions{display:flex;gap:6px;flex-wrap:wrap}button,a.btn{border:1px solid #33485c;background:#122232;color:white;border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#2563eb!important}.danger{background:#3f0d19!important;color:#fecdd3}.login{max-width:420px;margin:90px auto;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:24px}.login input,.toolbar input{padding:10px;border-radius:9px;border:1px solid #33485c;background:#09131d;color:white}.login input{width:100%;font-size:16px;margin:10px 0}.toolbar input{min-width:220px}.hidden{display:none!important}.meter{height:5px;background:#1b2b3b;border-radius:99px;margin-top:5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--g)}@media(max-width:980px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.w{padding:12px}}</style></head><body><div id="login" class="login"><h1>Toburt Agent Control Center</h1><p class="muted">Private control panel for the Digital Product Factory.</p><form id="lf"><input id="pin" type="password" placeholder="Access code" required><button class="primary" style="width:100%;padding:11px">Open Control Center</button><div id="lm" style="color:var(--r);margin-top:8px"></div></form></div><main id="app" class="w hidden"><div class="top"><div><h1>Digital Product Factory</h1><div class="muted">Monitor agents and approve, reject, retry, or review products.</div></div><div><span class="live">● LIVE</span><div id="stamp" class="sub"></div></div></div><div id="stats" class="stats"></div><div id="alerts"></div><div class="grid"><section class="panel"><div class="toolbar"><h2>Products & Pipeline</h2><div><input id="search" placeholder="Filter products"> <button id="refresh">Refresh</button></div></div><div class="scroll"><table><thead><tr><th>Product</th><th>Stage</th><th>Agent</th><th>QA</th><th>Health</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section><aside><section class="panel"><h2>Approval Queue</h2><div id="approvals"></div></section><section class="panel" style="margin-top:14px"><h2>Agents Running Now</h2><div id="active"></div></section><section class="panel" style="margin-top:14px"><h2>Recent Failures</h2><div id="fails"></div></section></aside></div></main><script>const API='https://wvhnfnmndtnkjrhxfqbf.supabase.co/functions/v1/dp-control-api';const $=s=>document.querySelector(s);let D=null,T=sessionStorage.getItem('dpcc')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const hdr=()=>T?{'x-dp-session':T}:{};function sc(s){if(['published','active','approved'].includes(s))return'green';if(s==='ready_for_approval')return'purple';if(s==='paused')return'yellow';if(['failed','rejected','retired'].includes(s))return'red';return'blue'}function health(p){if(p.stalled)return'<span class="badge red">STALLED</span>';if(p.loop)return'<span class="badge red">LOOP RISK</span>';if(p.failures24)return'<span class="badge yellow">'+p.failures24+' failure(s)</span>';return'<span class="badge green">Healthy</span>'}function salesUrl(p){return p.metadata?.sales_page_url||''}function supportUrl(p){return 'https://support.toburt.com/?product='+encodeURIComponent(p.slug||'')}function draw(){const term=$('#search').value.trim().toLowerCase();const ps=D.products.filter(p=>!term||p.name.toLowerCase().includes(term)||p.status.toLowerCase().includes(term));$('#rows').innerHTML=ps.map(p=>{const r=p.active_run||p.latest_run;const qa=p.qa_score==null?'—':Number(p.qa_score);const q=qa==='—'?'—':qa+'<div class="meter"><i style="width:'+Math.max(0,Math.min(100,qa))+'%"></i></div>';let links='';if(salesUrl(p))links+='<a class="btn" target="_blank" href="'+esc(salesUrl(p))+'">Sales Page</a>';links+='<a class="btn" target="_blank" href="'+supportUrl(p)+'">Support</a>';if(p.stan_url)links+='<a class="btn" target="_blank" href="'+esc(p.stan_url)+'">Stan</a>';links+='<button data-a="retry" data-id="'+p.id+'">Retry</button>';return'<tr class="'+(p.loop||p.stalled?'attn':'')+'"><td><div class="name">'+esc(p.name)+'</div><div class="sub">v'+p.current_version+'</div></td><td><span class="badge '+sc(p.status)+'">'+esc(p.status)+'</span></td><td>'+(r?esc(r.agent_name)+'<div class="sub">'+esc(r.run_type)+'</div>':'—')+'</td><td>'+q+'</td><td>'+health(p)+'</td><td><div class="actions">'+links+'</div></td></tr>'}).join('')||'<tr><td colspan="6">No matches.</td></tr>'}function render(){const c=D.counts;$('#stamp').textContent='Updated '+new Date(D.generated_at).toLocaleTimeString();$('#stats').innerHTML=[['Products',c.total],['Agents running',c.active],['Need attention',c.attention],['Awaiting approval',c.approvals],['Published',c.published]].map(x=>'<div class="card"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');const a=D.products.filter(p=>p.loop||p.stalled);$('#alerts').innerHTML=a.length?'<div class="alert"><b>'+a.length+' product(s) need attention.</b></div>':'';draw();$('#active').innerHTML=D.active_runs.length?D.active_runs.map(r=>'<div class="run"><b>'+esc(r.agent_name)+'</b><div class="sub">'+esc(r.run_type)+' · '+r.age_min+'m</div></div>').join(''):'<div class="muted">No agents running right now.</div>';$('#fails').innerHTML=D.recent_failures.length?D.recent_failures.slice(0,8).map(r=>'<div class="run"><b>'+esc(r.agent_name)+'</b><div class="sub">'+new Date(r.created_at).toLocaleString()+'</div><div class="err">'+esc(r.error_message||'Unknown failure')+'</div></div>').join(''):'<div class="muted">No recent failures.</div>';$('#approvals').innerHTML=D.approvals.length?D.approvals.map(a=>'<div class="run"><b>'+esc(a.product_name||a.name||a.product_id)+'</b><div class="sub">'+esc(a.status)+'</div><div class="actions" style="margin-top:7px"><button class="primary" data-a="approve" data-id="'+a.product_id+'">Approve</button><button data-a="changes" data-id="'+a.product_id+'">Request Changes</button><button class="danger" data-a="reject" data-id="'+a.product_id+'">Reject</button></div></div>').join(''):'<div class="muted">Nothing waiting for approval.</div>'}async function load(){if(!T)return;const r=await fetch(API+'?api=1',{headers:hdr()});if(r.status===401){T='';sessionStorage.removeItem('dpcc');$('#app').classList.add('hidden');$('#login').classList.remove('hidden');return}const x=await r.json();if(!r.ok||!x.ok)return;D=x;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}async function act(a,id){let note='';if(a==='changes')note=prompt('What changes do you want?')||'';if(!confirm('Confirm '+a.replace('_',' ')+'?'))return;const r=await fetch(API+'?action=1',{method:'POST',headers:{...hdr(),'content-type':'application/json'},body:JSON.stringify({action:a,product_id:id,note})});if(!r.ok)alert(await r.text());setTimeout(load,800)}$('#lf').addEventListener('submit',async ev=>{ev.preventDefault();$('#lm').textContent='';const r=await fetch(API+'?login=1',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin:$('#pin').value})});const x=await r.json().catch(()=>({}));if(!r.ok){$('#lm').textContent=x.error||'Login failed';return}T=x.session;sessionStorage.setItem('dpcc',T);$('#pin').value='';load()});$('#search').addEventListener('input',draw);$('#refresh').addEventListener('click',load);document.body.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.id)});if(T)load();setInterval(load,10000);</script></body></html>
