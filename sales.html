<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Toburt Digital Product</title><style>:root{color-scheme:dark;--bg:#070b12;--panel:#0e1622;--line:#28374a;--text:#f6f8fb;--muted:#a6b2c2;--accent:#7c3aed;--ok:#34d399}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#22123b 0,transparent 34%),var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1080px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0 28px}.brand{font-weight:900}.hero{padding:48px 0 30px;max-width:850px}.hero h1{font-size:clamp(38px,7vw,72px);line-height:.96;letter-spacing:-.05em;margin:10px 0 18px}.hero p{font-size:20px;color:#c2ccda;max-width:760px}.pill{display:inline-block;border:1px solid #8b5cf666;color:#c4b5fd;border-radius:999px;padding:5px 10px;font-weight:800;font-size:12px}.price{font-size:44px;font-weight:950;margin:22px 0}.cta{display:inline-block;background:linear-gradient(135deg,var(--accent),#5b21b6);color:white;text-decoration:none;border-radius:12px;padding:15px 22px;font-weight:900}.cta.disabled{opacity:.5;pointer-events:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}.card{background:linear-gradient(180deg,#111a28,#0b121c);border:1px solid var(--line);border-radius:16px;padding:22px}.card h2{margin-top:0}.bullets li{margin:10px 0}.muted{color:var(--muted)}details{border-top:1px solid var(--line);padding:14px 0}summary{font-weight:800;cursor:pointer}.foot{padding:30px 0;color:var(--muted);font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:16px}.hero{padding-top:28px}}</style></head><body><main class="wrap"><div class="top"><div class="brand">TOBURT</div><a href="https://support.toburt.com" class="muted">Product Support</a></div><section id="app"><div class="hero"><span class="pill">LOADING PRODUCT</span><h1>Loading…</h1></div></section></main><script>const API='https://wvhnfnmndtnkjrhxfqbf.supabase.co/functions/v1/dp-support-api';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=new URLSearchParams(location.search).get('product')||'';async function go(){const app=document.querySelector('#app');if(!slug){app.innerHTML='<div class="hero"><span class="pill">TOBURT</span><h1>Product not specified.</h1><p>Use the product link you were given.</p></div>';return}try{const r=await fetch(API+'?mode=sales&slug='+encodeURIComponent(slug),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Unable to load');const p=j.product;document.title=p.name+' | Toburt';const price=(Number(p.price_cents||0)/100).toFixed(0);const bullets=(p.bullets||[]).map(x=>'<li>'+esc(x)+'</li>').join('');const faq=(p.faq||[]).map(x=>'<details><summary>'+esc(x.q||x.question||'')+'</summary><div class="muted">'+esc(x.a||x.answer||'')+'</div></details>').join('');const buy=p.checkout_url?'<a class="cta" href="'+esc(p.checkout_url)+'">Get '+esc(p.name)+' — $'+price+'</a>':'<span class="cta disabled">Checkout opening soon</span>';app.innerHTML='<section class="hero"><span class="pill">DIGITAL TOOLKIT</span><h1>'+esc(p.headline||p.name)+'</h1><p>'+esc(p.subtitle||p.description||'')+'</p><div class="price">$'+price+'</div>'+buy+'</section><section class="grid"><article class="card"><h2>What this helps you do</h2><p class="muted">'+esc(p.description||'')+'</p></article><article class="card"><h2>What you get</h2><ul class="bullets">'+bullets+'</ul></article><article class="card"><h2>Simple setup</h2><p class="muted">Download the files, open START_HERE, and follow the plain-English setup guide. Core features work without optional automation unless the product says otherwise.</p></article><article class="card"><h2>Support included</h2><p class="muted">Every Toburt product includes self-service product guidance and AI help for setup, use, and troubleshooting.</p><a href="'+esc(p.support_url)+'">Open product support →</a></article></section>'+(faq?'<section class="card"><h2>Frequently asked questions</h2>'+faq+'</section>':'')+'<div class="foot">Digital products are organizational/educational tools. Product-specific limitations and professional-review notices are included where applicable.</div>'}catch(e){app.innerHTML='<div class="hero"><span class="pill">UNAVAILABLE</span><h1>We could not load this product.</h1><p>'+esc(e.message||e)+'</p></div>'}}go();</script></body></html>
